<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Recuperación de Contraseña</title></head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
<div style="max-width: 600px; margin: 0 auto; background: #f9f9f9; border-radius: 8px; padding: 30px;">
  <h2 style="color: #1d4ed8;">Hola {{username}},</h2>
  <p>Hemos recibido una solicitud para restablecer tu contraseña. Haz clic en el siguiente enlace para continuar:</p>
  <p style="text-align: center; margin: 30px 0;">
    <a href="{{resetLink}}" style="background: #1d4ed8; color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold;">Restablecer Contraseña</a>
  </p>
  <p>Si no solicitaste este cambio, puedes ignorar este correo.</p>
  <p style="color: #666;">Este enlace expirará en {{expirationMinutes}} minutos.</p>
  <hr style="border: none; border-top: 1px solid #ddd;">
  <p style="color: #999; font-size: 12px;">El equipo de EduLLM</p>
</div>
</body>
</html>
