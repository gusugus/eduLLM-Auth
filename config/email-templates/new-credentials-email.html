<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Credenciales de Acceso</title></head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
<div style="max-width: 600px; margin: 0 auto; background: #f9f9f9; border-radius: 8px; padding: 30px;">
  <h2 style="color: #1d4ed8;">Hola {{username}},</h2>
  <p>Se han generado nuevas credenciales para tu cuenta:</p>
  <div style="background: #e5e7eb; border-radius: 6px; padding: 15px; margin: 20px 0;">
    <p><strong>Usuario:</strong> {{username}}</p>
    <p><strong>Contraseña:</strong> <span style="font-family: monospace; font-size: 16px; background: white; padding: 4px 8px; border-radius: 4px;">{{newPassword}}</span></p>
  </div>
  <p style="color: #dc2626;"><strong>Importante:</strong> Al iniciar sesión por primera vez, se te solicitará cambiar esta contraseña por una que recuerdes fácilmente.</p>
  <hr style="border: none; border-top: 1px solid #ddd;">
  <p style="color: #999; font-size: 12px;">El equipo de EduLLM</p>
</div>
</body>
</html>
